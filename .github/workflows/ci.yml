name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Causality audits A and B
        run: python -m camase --audits
      - name: Regenerate fast tables
        run: python scripts/reproduce_results.py --light
      - name: Tables match committed results
        run: |
          git diff --exit-code -- results/track_a.json results/ablation.json \
            results/diagnostics.json results/gate_roc.json results/identification.json \
            || (echo "committed tables differ from regeneration; run scripts/reproduce_results.py --light and commit" && exit 1)
